      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed APK
        shell: bash
        run: |
          if [ -n "${TITAN_KEYSTORE_PASSWORD:-}" ] && [ -n "${TITAN_KEYSTORE_B64:-}" ]; then
            echo "$TITAN_KEYSTORE_B64" | base64 --decode > titan-release.jks
            export TITAN_KEYSTORE_PATH="$GITHUB_WORKSPACE/titan-release.jks"
            export TITAN_KEY_ALIAS="${TITAN_KEY_ALIAS:-titan}"
            export TITAN_KEY_PASSWORD="${TITAN_KEY_PASSWORD:-$TITAN_KEYSTORE_PASSWORD}"
          else
            keytool -genkeypair -v -keystore titan-release.jks -storepass temp123456 -keypass temp123456 \
              -alias titan -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=TITAN AA, OU=Android, O=TITAN, L=Local, ST=Local, C=DE"
            export TITAN_KEYSTORE_PATH="$GITHUB_WORKSPACE/titan-release.jks"
            export TITAN_KEY_ALIAS="titan"
            export TITAN_KEY_PASSWORD="temp123456"
            export TITAN_KEYSTORE_PASSWORD="temp123456"
          fi
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-AA-Android15
          path: app/build/outputs/apk/release/app-release.apk

name: Build TITAN APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.12
            3.11

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project from your TITAN .py
        run: |
          set -e
          for z in ./*.zip; do [ -f "$z" ] && unzip -o -q "$z" -d unz_extract || true; done
          SRC=$(grep -rl "def run_titan" --include=*.py . 2>/dev/null | grep -v "^./proj/" | head -1 || true) if [ -z "$SRC" ]; then echo "ERROR: no TITAN .py (or zip containing it) found in the repo"; exit 1; fi echo "Using $SRC" mkdir -p proj/app/src/main/java/com/titan/app proj/app/src/main/python proj/app/src/main/res/values proj/app/src/main/res/xml cp "$SRC" proj/app/src/main/python/titan_app.py cat > proj/settings.gradle.kts <<'EOF_0' pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } } dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS) repositories { google(); mavenCentral() } } rootProject.name = "TitanPro" include(":app") EOF_0 cat > proj/build.gradle.kts <<'EOF_1' plugins { id("com.android.application") version "8.5.2" apply false id("org.jetbrains.kotlin.android") version "1.9.24" apply false id("com.chaquo.python") version "16.1.0" apply false } EOF_1 cat > proj/gradle.properties <<'EOF_2' org.gradle.jvmargs=-Xmx3g android.useAndroidX=true android.nonTransitiveRClass=true EOF_2 cat > proj/app/build.gradle.kts <<'EOF_3' plugins { id("com.android.application") id("org.jetbrains.kotlin.android") id("com.chaquo.python") } android { namespace = "com.titan.app" compileSdk = 34 defaultConfig { applicationId = "com.titan.app" minSdk = 24 targetSdk = 34 versionCode = 60 versionName = "V60" ndk { abiFilters += listOf("arm64-v8a", "x86_64") } } buildTypes { release { isMinifyEnabled = false signingConfig = signingConfigs.getByName("debug") // personal use; replace for Play Store } } compileOptions { sourceCompatibility = JavaVersion.VERSION_17 targetCompatibility = JavaVersion.VERSION_17 } kotlinOptions { jvmTarget = "17" } } chaquopy { defaultConfig { version = "3.12" pip { install("numpy") install("pandas") install("requests") install("flask") install("waitress") install("websocket-client") } } } dependencies { implementation("androidx.core:core-ktx:1.13.1") implementation("androidx.appcompat:appcompat:1.7.0") } EOF_3 cat > proj/app/src/main/AndroidManifest.xml <<'EOF_4' <?xml version="1.0" encoding="utf-8"?> <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <!-- Script is hard-locked to /storage/emulated/0/KKK -->
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

              <application
                  android:label="TITAN"
                  android:icon="@android:drawable/ic_menu_compass"
                  android:usesCleartextTraffic="true"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@style/Theme.Titan">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".TitanService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          EOF_4
          cat > proj/app/src/main/res/xml/network_security_config.xml <<'EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="false">127.0.0.1</domain>
                  <domain includeSubdomains="false">localhost</domain>
              </domain-config>
          </network-security-config>
          EOF_5
          cat > proj/app/src/main/res/values/themes.xml <<'EOF_6'
          <resources>
              <style name="Theme.Titan" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#02060F</item>
                  <item name="android:statusBarColor">#02060F</item>
                  <item name="android:navigationBarColor">#02060F</item>
              </style>
          </resources>
          EOF_6
          cat > proj/app/src/main/python/titan_runner.py <<'EOF_7'
          """Starts the TITAN Flask dashboard inside the Android app (called from TitanService)."""
          import os
          import threading

          _started = False
          _lock = threading.Lock()


          def start(port: int = 8080) -> str:
              global _started
              with _lock:
                  if _started:
                      return "already-running"
                  _started = True
              os.environ["TITAN_PORT"] = str(port)
              try:
                  import titan_app  # needs All-files access to /storage/emulated/0/KKK
                  titan_app.run_titan(open_browser=False)  # blocks (waitress / flask)
                  return "stopped"
              except Exception as exc:
                  _started = False
                  import traceback
                  return "ERROR: " + repr(exc) + "\n" + traceback.format_exc()
          EOF_7
          cat > proj/app/src/main/java/com/titan/app/TitanService.kt <<'EOF_8'
          package com.titan.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import android.util.Log
          import androidx.core.app.NotificationCompat
          import com.chaquo.python.Python
          import com.chaquo.python.android.AndroidPlatform

          class TitanService : Service() {

              companion object {
                  const val PORT = 8080
                  @Volatile var lastError: String? = null
                  @Volatile var running = false
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startForegroundCompat()
                  if (!running) {
                      running = true
                      Thread({
                          try {
                              if (!Python.isStarted()) Python.start(AndroidPlatform(applicationContext))
                              val res = Python.getInstance().getModule("titan_runner")
                                  .callAttr("start", PORT).toString()
                              Log.i("TITAN", "runner finished: $res")
                              if (res.startsWith("ERROR")) lastError = res
                          } catch (t: Throwable) {
                              lastError = t.toString()
                              Log.e("TITAN", "python crashed", t)
                          } finally {
                              running = false
                          }
                      }, "titan-python").start()
                  }
                  return START_STICKY
              }

              private fun startForegroundCompat() {
                  val chId = "titan_engine"
                  val nm = getSystemService(NotificationManager::class.java)
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(
                          NotificationChannel(chId, "TITAN Engine", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val n: Notification = NotificationCompat.Builder(this, chId)
                      .setContentTitle("TITAN is running")
                      .setContentText("Analysis engine active on 127.0.0.1:$PORT")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  } else {
                      startForeground(1, n)
                  }
              }
          }
          EOF_8
          cat > proj/app/src/main/java/com/titan/app/MainActivity.kt <<'EOF_9'
          package com.titan.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.View
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import java.net.InetSocketAddress
          import java.net.Socket

          class MainActivity : AppCompatActivity() {

              private lateinit var web: WebView
              private lateinit var status: TextView
              private val ui = Handler(Looper.getMainLooper())
              @Volatile private var loaded = false
              @Volatile private var waiting = false

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  status = TextView(this).apply {
                      setTextColor(0xFFE8F1FF.toInt()); setBackgroundColor(0xFF02060F.toInt())
                      textSize = 16f; setPadding(48, 96, 48, 48)
                      text = "TITAN is starting…"
                  }
                  web = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                      webViewClient = WebViewClient()
                      webChromeClient = WebChromeClient()
                      visibility = View.GONE
                  }
                  val root = FrameLayout(this)
                  root.addView(web); root.addView(status)
                  setContentView(root)

                  if (Build.VERSION.SDK_INT >= 33 &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                      != PackageManager.PERMISSION_GRANTED
                  ) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  if (!hasStorageAccess()) {
                      status.text = "TITAN stores everything in Internal Storage/KKK.\n\n" +
                          "Please allow \"All files access\" for this app, then come back."
                      requestStorageAccess()
                      return
                  }
                  if (!TitanService.running) {
                      ContextCompat.startForegroundService(this, Intent(this, TitanService::class.java))
                  }
                  waitForServerThenLoad()
              }

              private fun hasStorageAccess(): Boolean =
                  if (Build.VERSION.SDK_INT >= 30) Environment.isExternalStorageManager()
                  else ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) ==
                      PackageManager.PERMISSION_GRANTED

              private fun requestStorageAccess() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      try {
                          startActivity(Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                              Uri.parse("package:$packageName")))
                      } catch (e: Exception) {
                          startActivity(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION))
                      }
                  } else {
                      ActivityCompat.requestPermissions(this, arrayOf(
                          Manifest.permission.READ_EXTERNAL_STORAGE,
                          Manifest.permission.WRITE_EXTERNAL_STORAGE), 2)
                  }
              }

              private fun waitForServerThenLoad() {
                  if (loaded || waiting) return
                  waiting = true
                  Thread {
                      var tries = 0
                      while (tries < 240 && !loaded) {   // ~2 min: first launch imports pandas/numpy
                          TitanService.lastError?.let { err ->
                              ui.post { status.text = "TITAN failed to start:\n\n$err" }
                              waiting = false
                              return@Thread
                          }
                          if (portOpen()) {
                              ui.post {
                                  loaded = true
                                  web.loadUrl("http://127.0.0.1:${TitanService.PORT}")
                                  web.visibility = View.VISIBLE
                                  status.visibility = View.GONE
                              }
                              waiting = false
                              return@Thread
                          }
                          tries++
                          Thread.sleep(500)
                      }
                      ui.post { status.text = "Server did not respond. See Internal Storage/KKK/data/titan_engine.log" }
                      waiting = false
                  }.start()
              }

              private fun portOpen(): Boolean = try {
                  Socket().use { it.connect(InetSocketAddress("127.0.0.1", TitanService.PORT), 300); true }
              } catch (e: Exception) { false }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (loaded && web.canGoBack()) web.goBack() else moveTaskToBack(true)
              }
          }
          EOF_9

      - name: Build debug APK
        working-directory: proj
        run: |
          gradle assembleDebug --no-daemon --stacktrace || {
            echo "Retrying with Python 3.11"
            sed -i 's/version = "3.12"/version = "3.11"/' app/build.gradle.kts
            gradle assembleDebug --no-daemon --stacktrace
          }

      - uses: actions/upload-artifact@v4
        with:
          name: TITAN-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
